<!DOCTYPE html>
<html>
<head>
    <title>Test Chart</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div id="test-chart" style="width:100%;height:600px;"></div>
    
    <script>
    // Simple test data
    var candleData = {
        x: ['2025-08-07 12:35:00', '2025-08-07 12:40:00', '2025-08-07 12:45:00', '2025-08-07 12:50:00'],
        open: [167.49, 167.46, 167.70, 168.21],
        high: [167.65, 167.71, 168.22, 168.43],
        low: [167.44, 167.45, 167.65, 168.09],
        close: [167.46, 167.70, 168.21, 168.39],
        type: 'candlestick',
        name: 'SOLUSDT'
    };
    
    var layout = {
        title: 'Test Candlestick Chart',
        xaxis: {
            title: 'Time',
            type: 'date'
        },
        yaxis: {
            title: 'Price (USDT)'
        }
    };
    
    Plotly.newPlot('test-chart', [candleData], layout);
    </script>
</body>
</html>
