# Modular Trading System Configuration

# Data Collector Module
data_collector:
  exchange: "bybit"
  api_key: "${BYBIT_API_KEY}"
  api_secret: "${BYBIT_API_SECRET}"
  testnet: true
  rate_limit: 10
  default_symbol: "SOLUSDT"
  default_timeframes: ["1m", "5m", "15m", "1h"]
  output_format: "csv"
  data_path: "data/raw/"

# Backtester Module  
backtester:
  initial_balance: 10000.0
  commission: 0.001  # 0.1%
  slippage: 0.0005   # 0.05%
  min_trade_amount: 10.0
  results_path: "output/backtests/"
  
  # Default strategy parameters
  strategy_defaults:
    timeframe: "5m"
    lookback_period: 100
    position_size_pct: 0.02
    stop_loss_pct: 0.02
    take_profit_pct: 0.04

# Reporter Module
reporter:
  output_path: "output/reports/"
  chart_width: 1200
  chart_height: 600
  theme: "plotly_dark"
  include_trade_details: true
  include_performance_metrics: true
  
  # Chart settings
  charts:
    price_chart: true
    equity_curve: true
    drawdown_chart: true
    trade_distribution: true
    monthly_returns: true

# Trading Bot Module (placeholder)
trading_bot:
  paper_trading: true
  symbol: "SOLUSDT"
  timeframe: "5m" 
  max_position_size: 0.02
  risk_per_trade: 0.01
  
# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/system.log"

# Environment
environment: "development"
debug: false